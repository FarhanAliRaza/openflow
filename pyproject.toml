[project]
name = "openwhispr"
version = "0.1.0"
description = "Voice typing and transcription using Qwen3-ASR"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.5.0",
    "scipy>=1.11.0",
    "pyperclip>=1.8.0",
    "qwen-asr>=0.0.6",
    "transformers>=4.52",
    "tokenizers>=0.22",
    "evdev>=1.7.0",
]

[project.optional-dependencies]
gradio = ["gradio>=4.0"]
dev = ["pytest>=7.0.0"]

[tool.uv]
python = "3.12"
dev-dependencies = ["pytest>=7.0.0"]
override-dependencies = ["numba>=0.60", "llvmlite>=0.43", "librosa>=0.10"]
